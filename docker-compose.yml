services:
  postgres:
    image: postgres:16-alpine
    container_name: mosimi-postgres
    environment:
      POSTGRES_USER: mosimi
      POSTGRES_PASSWORD: mosimi
      POSTGRES_DB: mosimi
    ports:
      - '5432:5432'
    volumes:
      - mosimi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mosimi -d mosimi']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mosimi_pgdata:
